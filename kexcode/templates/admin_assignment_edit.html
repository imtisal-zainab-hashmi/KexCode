{% extends "layout.html" %}

{% block title %}Edit Assignment | Admin{% endblock %}

{% block main %}
<div class="admin-page">

    <div class="page-top-row">
        <div>
            <a class="back-link" href="/admin/assignments">← Back to assignments</a>
            <p class="eyebrow">{{ assignment.class_name }}</p>
            <h1>Edit Assignment</h1>
        </div>
    </div>

    <section class="admin-card">
        <form action="/admin/assignments/{{ assignment.id }}/edit" method="post" class="admin-form">
            <div class="form-grid-2">
                <div class="form-group">
                    <label for="class_id">Class</label>
                    <select id="class_id" name="class_id" required>
                        {% for c in classes %}
                            <option value="{{ c.id }}" {% if assignment.class_id == c.id %}selected{% endif %}>
                                {{ c.name }}
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label for="language">Primary Language</label>
                    <select id="language" name="language">
                        <option value="python" {% if assignment.language == 'python' %}selected{% endif %}>Python</option>
                        <option value="javascript" {% if assignment.language == 'javascript' %}selected{% endif %}>JavaScript</option>
                        <option value="html" {% if assignment.language == 'html' %}selected{% endif %}>HTML</option>
                        <option value="css" {% if assignment.language == 'css' %}selected{% endif %}>CSS</option>
                    </select>
                </div>
            </div>

            <div class="form-grid-2">
                <div class="form-group">
                    <label for="title">Assignment Title</label>
                    <input id="title" type="text" name="title" value="{{ assignment.title }}" required>
                </div>

                <div class="form-group">
                    <label for="due_date">Due Date</label>
                    <input id="due_date" type="datetime-local" name="due_date" value="{{ assignment.due_date }}">
                </div>
            </div>

            <div class="form-group">
                <label for="description">Instructions / Problem Description</label>
                <textarea id="description" name="description" rows="5">{{ assignment.description }}</textarea>
            </div>

            <div class="form-group">
                <label for="starter_code">Starter Code Template</label>
                <textarea id="starter_code" name="starter_code" rows="7" class="code-textarea">{{ assignment.starter_code }}</textarea>
            </div>

            <div class="note-form-actions">
                <a href="/admin/assignments" class="secondary-btn note-edit-link">Cancel</a>
                <button type="submit" class="button">Save Changes</button>
            </div>
        </form>
    </section>

</div>
{% endblock %}
